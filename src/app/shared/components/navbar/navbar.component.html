<!-- ============================================================
     NavbarComponent — top application header
     Background: #121214 (darkBg)  Height: ~56 px  Full-width
     ============================================================ -->
<header class="w-full bg-darkBg border-b border-white/10">
  <nav
    class="flex items-center h-14 px-4 gap-0"
    aria-label="Main navigation"
  >

    <!-- ── Brand ──────────────────────────────────────────────── -->
    <a
      routerLink="/"
      class="flex items-center gap-2 shrink-0 text-white hover:text-white/90 transition-colors"
      aria-label="Book Worm home"
    >
      <!-- Book SVG icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-6 h-6 text-white"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
      </svg>
      <span class="text-base font-semibold tracking-wide leading-none">
        Book Worm
      </span>
    </a>

    <!-- ── Vertical divider ──────────────────────────────────── -->
    <div class="w-px h-6 bg-white/20 mx-5 shrink-0" aria-hidden="true"></div>

    <!-- ── Nav links ─────────────────────────────────────────── -->
    <ul class="flex items-center gap-7 list-none m-0 p-0 flex-1">
      <li>
        <a
          routerLink="/orders"
          routerLinkActive="text-white"
          class="text-sm font-medium text-white/60 hover:text-white transition-colors"
          ariaCurrentWhenActive="page"
        >
          My Orders
        </a>
      </li>
      <li>
        <a
          routerLink="/wishlist"
          routerLinkActive="text-white"
          class="text-sm font-medium text-white/60 hover:text-white transition-colors"
          ariaCurrentWhenActive="page"
        >
          My Wishlist
        </a>
      </li>
      <li>
        <a
          routerLink="/writers"
          routerLinkActive="text-white"
          class="text-sm font-medium text-white/60 hover:text-white transition-colors"
          ariaCurrentWhenActive="page"
        >
          My Writers
        </a>
      </li>
    </ul>

    <!-- ── Right actions ─────────────────────────────────────── -->
    <div class="flex items-center gap-4 shrink-0">

      <!-- Cart icon + badge -->
      <a
        routerLink="/cart"
        class="relative flex items-center justify-center text-white/70 hover:text-white transition-colors"
        aria-label="Shopping cart"
      >
        <!-- Cart SVG -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-6 h-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>

        <!-- Dynamic badge — visible only when cart has items -->
        @if (cartService.totalItems() > 0) {
          <span
            class="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1
                   bg-red-500 text-white text-[10px] font-bold leading-none
                   rounded-full flex items-center justify-center"
            aria-label="{{ cartService.totalItems() }} items in cart"
          >
            {{ cartService.totalItems() > 99 ? '99+' : cartService.totalItems() }}
          </span>
        }
      </a>

      <!-- User profile avatar -->
      <button
        type="button"
        class="flex items-center justify-center w-8 h-8 rounded-full
               bg-white/10 border border-white/20
               text-white/70 hover:text-white hover:bg-white/20
               transition-colors"
        aria-label="User profile"
      >
        <!-- Person SVG -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </button>

    </div><!-- /right actions -->
  </nav>
</header>
